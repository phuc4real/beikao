# Cloudflare Worker — beikao (see cloudflare_migration_plan.md §9.1).
#
# One Worker serves BOTH the built SPA (Static Assets) and the API/WS routes, so
# the browser, the API, and the WebSocket are all same-origin. Phase C0 is a
# scaffold: a health endpoint, anonymous-token minting, and a WS echo RoomDO used
# only to measure round-trip latency vs. the ~1.3s Supabase baseline. The real
# RoomDO/LobbyDO/D1 land in C1.

name = "beikao"
main = "cloudflare/src/worker.ts"
compatibility_date = "2025-01-01"

# No per-version preview URLs — only the main workers.dev route (+ later the
# custom domain). Flip to true if you want per-version preview URLs for QA.
preview_urls = false

# The Worker + DOs reuse the app engine/authority/protocol VERBATIM from src/
# (imported as `@/...`). The `@/*` alias is resolved by esbuild via the root
# tsconfig.json `paths` (the nearest tsconfig to the src/ files), so no wrangler
# [alias] is needed — this replaces the old Deno import-map + engine.bundle.js step.

# Serve the Vite build output. With a `binding`, the Worker controls routing:
# static assets that exist are served first; everything else invokes the Worker,
# which handles /api/* + the WS upgrade and otherwise falls back to env.ASSETS
# (index.html for SPA client routes via not_found_handling).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# One Durable Object per room code (idFromName(code)) — authority + sockets +
# betting-deadline alarm. The LobbyDO is a single 'global' instance fanning out
# live room-browser change pings.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# DO class migrations. SQLite-backed storage (`new_sqlite_classes`) is the modern
# default and the only kind allowed on the free plan. v1 was deployed in C0 with
# RoomDO; LobbyDO is added in its own v2 migration (existing tags are immutable).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDO"]

# Cross-room durable data (profiles + room directory). Create it once with
# `npx wrangler d1 create beikao` and paste the returned id below; the deploy
# command then applies migrations: `wrangler d1 migrations apply beikao --remote`.
[[d1_databases]]
binding = "DB"
database_name = "beikao"
database_id = "4370f46d-0b37-40e1-87ff-a64d6d941317"
migrations_dir = "cloudflare/migrations"

# The custom-domain route lands in C3 (needs the domain on Cloudflare). Until
# then this serves from the workers.dev host.
#
# [[routes]]
# pattern = "beikao.<domain>"
# custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1